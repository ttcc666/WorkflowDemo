name: approval-pilot

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.20.0'
      - run: dotnet tool restore
      - run: dotnet restore 'Workflow.slnx'
      - run: dotnet build 'Workflow.slnx' --no-restore --configuration 'Release'
      - run: dotnet test 'Workflow.slnx' --no-build --no-restore --configuration 'Release' --verbosity 'minimal'
      - run: dotnet ef migrations has-pending-model-changes --project 'samples/Certificate.Api' --startup-project 'samples/Certificate.Api' --configuration 'Release' --no-build
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm typecheck
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: pnpm build:lib
        working-directory: web
      - run: pnpm build
        working-directory: web
      - name: Check smoke script syntax
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'samples/Certificate.Api/smoke-test.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors -join [Environment]::NewLine) }
